<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ski Verde</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(10, 30, 50, 0.75); color: #fff; text-align: center; z-index: 10; padding: 24px; }
  .overlay.visible { display: flex; }
  .overlay h1 { font-size: 2.2rem; }
  .overlay p { font-size: 1.5rem; }
  .overlay button { font-size: 1.6rem; padding: 14px 36px; border: none; border-radius: 10px; background: #2f80d0; color: #fff; }
  .overlay button:active { background: #1f5f9f; }
  .screen-hint { font-size: 1.5rem; font-weight: 700; margin-top: 8px; }
  #start-screen button { background: rgba(38, 66, 98, .92); box-shadow: 0 6px 16px rgba(0, 0, 0, .4); }
  #start-screen button:active { background: rgba(56, 92, 130, .95); }
  .overlay button small { display: block; font-size: 1.5rem; font-weight: 400; opacity: .85; margin-top: 2px; }
  #track-list { display: flex; flex-direction: column; gap: 12px; width: min(92vw, 420px); max-height: 62vh; overflow-y: auto; }
  .overlay .track-card { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; background: rgba(38, 66, 98, .92); border: none; border-left: 5px solid var(--accent, #fff); border-radius: 12px; padding: 14px 16px; color: #fff; font-size: 1.5rem; box-shadow: 0 6px 16px rgba(0, 0, 0, .4); }
  .overlay .track-card:active { background: rgba(56, 92, 130, .95); }
  .track-emoji { font-size: 1.9rem; }
  .track-title { display: flex; align-items: baseline; gap: 8px; font-size: 1.8rem; font-weight: 700; }
  .track-title small { font-size: 1.5rem; font-weight: 400; opacity: .85; }
  .track-stats { display: block; font-size: 1.5rem; opacity: .95; margin-top: 4px; }
  .track-best { display: block; font-size: 1.5rem; color: #ffdd57; margin-top: 4px; }
  #btn-back-controls { background: none; font-size: 1.5rem; opacity: .8; padding: 8px; }
  #hud { position: fixed; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 0 16px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 1.5rem; font-variant-numeric: tabular-nums; z-index: 5; pointer-events: none; }
  #timer { display: flex; align-items: center; gap: 8px; height: 44px; font-weight: 700; background: rgba(10,30,50,.55); border-radius: 8px; padding: 0 14px; text-shadow: none; }
  #center-group { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  #track-name { font-size: 1.5rem; font-weight: 700; background: rgba(10,30,50,.45); border-radius: 8px; padding: 2px 10px; text-shadow: none; }
  #speed-num { display: flex; align-items: baseline; gap: 4px; height: 44px; align-items: center; }
  #btn-pause { pointer-events: auto; background: rgba(10,30,50,.45); border: none; color: #fff; font-size: 1.5rem; border-radius: 8px; padding: 4px 16px; text-shadow: none; }
  #btn-pause:active { background: rgba(10,30,50,.7); }
  #speed-group { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  #speed-bar { width: 96px; height: 15px; border-radius: 7px; background: rgba(10,30,50,.45); overflow: hidden; }
  #speed-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7fd4ff, #ffdd57 65%, #e04848); background-size: 96px 100%; transition: width .15s linear; }
  #speed-num { font-size: 1.5rem; font-weight: 700; color: #fff; background: rgba(10,30,50,.55); border-radius: 8px; padding: 2px 10px; text-shadow: none; font-variant-numeric: tabular-nums; }
  #speed-value { font-size: 1.9rem; }
  #message { position: fixed; top: 20%; width: 100%; text-align: center; color: #ffdd57; font-size: 1.6rem; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.7); opacity: 0; transition: opacity .3s; z-index: 5; pointer-events: none; }
  #message.visible { opacity: 1; }
  #finish-record { color: #ffdd57; font-weight: 700; }
  #finish-screen p { font-size: 1.5rem; }
  #finish-screen #finish-track { font-size: 1.5rem; opacity: .85; }
  #finish-screen #finish-time { font-size: 2rem; font-weight: 700; }
  #finish-screen #finish-record { font-size: 1.6rem; }
</style>
</head>
<body>
<div id="hud"><div id="speed-group"><span id="speed-num"><span id="speed-value">0</span> km/h</span><div id="speed-bar" aria-label="Velocidad"><div id="speed-fill"></div></div></div><div id="center-group"><span id="timer">⏱ <span id="timer-text">00:00.00</span></span><span id="track-name"></span></div><button id="btn-pause" aria-label="Pausa">⏸</button></div>
<div id="message"></div>
<div id="start-screen" class="overlay visible">
  <h1>⛷️ Ski</h1>
  <p>Baja lo más rápido posible sin caerte.</p>
  <p class="screen-hint">¿Cómo quieres jugar?</p>
  <button id="btn-touch">👆 Táctil<small>mantén pulsado un lado de la pantalla</small></button>
  <button id="btn-gyro">📱 Giroscopio<small>inclina el teléfono para girar</small></button>
</div>
<div id="track-screen" class="overlay">
  <h1>Elige pista</h1>
  <div id="track-list"></div>
  <button id="btn-back-controls">‹ Cambiar controles</button>
</div>
<div id="finish-screen" class="overlay">
  <h1>🏁 ¡Meta!</h1>
  <p id="finish-track"></p>
  <p id="finish-time"></p>
  <p id="finish-best"></p>
  <p id="finish-speed"></p>
  <p id="finish-record" style="display:none">¡Nuevo récord!</p>
  <button id="btn-restart">Reintentar</button>
  <button id="btn-menu">Menú</button>
</div>
<div id="fall-screen" class="overlay">
  <h1>💥 ¡Te has caído!</h1>
  <p>Crono detenido — pulsa Continuar para seguir.</p>
  <button id="btn-continue">Continuar</button>
  <button id="btn-restart-fall">Volver a empezar</button>
  <button id="btn-menu-fall">Menú</button>
</div>
<div id="pause-screen" class="overlay">
  <h1>⏸ Pausa</h1>
  <button id="btn-resume">Continuar</button>
  <button id="btn-restart-pause">Volver a empezar</button>
  <button id="btn-menu-pause">Menú</button>
</div>
<div id="error-screen" class="overlay"><h1>Tu navegador no soporta WebGL</h1></div>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js?v=1784324765" } }
</script>
<script type="module" src="./src/main.js?v=1784324765"></script>
</body>
</html>
