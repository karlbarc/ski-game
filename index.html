<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Ski Verde</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; touch-action: none; font-family: system-ui, sans-serif; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  .overlay { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: rgba(10, 30, 50, 0.75); color: #fff; text-align: center; z-index: 10; padding: 24px; }
  .overlay.visible { display: flex; }
  .overlay h1 { font-size: 2.2rem; }
  .overlay button { font-size: 1.3rem; padding: 14px 36px; border: none; border-radius: 10px; background: #2f80d0; color: #fff; }
  .overlay button:active { background: #1f5f9f; }
  #hud { position: fixed; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 0 16px; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); font-size: 1.4rem; font-variant-numeric: tabular-nums; z-index: 5; pointer-events: none; }
  #btn-pause { pointer-events: auto; background: rgba(10,30,50,.45); border: none; color: #fff; font-size: 1.2rem; border-radius: 8px; padding: 4px 16px; text-shadow: none; }
  #btn-pause:active { background: rgba(10,30,50,.7); }
  #speed-group { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #speed-bar { width: 96px; height: 12px; border-radius: 6px; background: rgba(10,30,50,.45); overflow: hidden; }
  #speed-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #7fd4ff, #ffdd57 65%, #e04848); background-size: 96px 100%; transition: width .15s linear; }
  #speed-num { font-size: 1rem; font-weight: 700; color: #fff; background: rgba(10,30,50,.55); border-radius: 8px; padding: 2px 10px; text-shadow: none; font-variant-numeric: tabular-nums; }
  #speed-value { font-size: 1.7rem; }
  #message { position: fixed; top: 20%; width: 100%; text-align: center; color: #ffdd57; font-size: 1.6rem; font-weight: 700; text-shadow: 0 2px 4px rgba(0,0,0,.7); opacity: 0; transition: opacity .3s; z-index: 5; pointer-events: none; }
  #message.visible { opacity: 1; }
  #finish-record { color: #ffdd57; font-weight: 700; }
</style>
</head>
<body>
<div id="hud"><span id="timer">00:00.00</span><button id="btn-pause" aria-label="Pausa">⏸</button><div id="speed-group"><div id="speed-bar" aria-label="Velocidad"><div id="speed-fill"></div></div><span id="speed-num"><span id="speed-value">0</span> km/h</span></div></div>
<div id="message"></div>
<div id="start-screen" class="overlay visible">
  <h1>⛷️ Pista Verde</h1>
  <p>Baja lo más rápido posible sin caerte.<br>Mantén pulsado un lado de la pantalla para girar.</p>
  <button id="btn-touch">Jugar (táctil)</button>
  <button id="btn-gyro">Jugar (giroscopio)</button>
</div>
<div id="finish-screen" class="overlay">
  <h1>🏁 ¡Meta!</h1>
  <p id="finish-time"></p>
  <p id="finish-best"></p>
  <p id="finish-speed"></p>
  <p id="finish-record" style="display:none">¡Nuevo récord!</p>
  <button id="btn-restart">Reintentar</button>
</div>
<div id="fall-screen" class="overlay">
  <h1>💥 ¡Te has caído!</h1>
  <p>El crono sigue corriendo…</p>
  <button id="btn-continue">Continuar</button>
  <button id="btn-restart-fall">Volver a empezar</button>
</div>
<div id="pause-screen" class="overlay">
  <h1>⏸ Pausa</h1>
  <button id="btn-resume">Continuar</button>
  <button id="btn-restart-pause">Volver a empezar</button>
</div>
<div id="error-screen" class="overlay"><h1>Tu navegador no soporta WebGL</h1></div>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js" } }
</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
